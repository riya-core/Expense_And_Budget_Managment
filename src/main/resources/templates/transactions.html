<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Transactions')}"></head>
<body>
<link rel="stylesheet" th:href="@{/css/transactions.css}">
<div class="shell">

  <aside th:replace="~{fragments/layout :: sidebar('transactions')}"></aside>

  <div class="content">

    <section class="hero">
      <p class="greet">Expense Tracker</p>
      <header th:replace="~{fragments/layout :: topbar('Transactions', 'Keep track of your money. View, filter and manage all your transactions in one place.')}"></header>
    </section>

    <main class="page" id="main">

      <!-- Summary cards (this month) -->
      <section class="cards" aria-label="This month">
        <article class="stat s-lavender">
          <div class="stat-head">
            <span class="chip chip-violet"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>
            <span class="lbl">Total Income</span>
          </div>
          <p class="val" id="sum-income">–</p>
          <p class="note">This month</p>
        </article>
        <article class="stat s-peach">
          <div class="stat-head">
            <span class="chip chip-amber"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span>
            <span class="lbl">Total Expenses</span>
          </div>
          <p class="val" id="sum-expense">–</p>
          <p class="note">This month</p>
        </article>
        <article class="stat s-green">
          <div class="stat-head">
            <span class="chip chip-green"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2M3 10h18"/></svg></span>
            <span class="lbl">Remaining Balance</span>
          </div>
          <p class="val" id="sum-balance">–</p>
          <p class="note">This month</p>
        </article>
        <article class="stat s-blue">
          <div class="stat-head">
            <span class="chip chip-navy"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></span>
            <span class="lbl">Budget Left</span>
          </div>
          <p class="val" id="sum-budget">–</p>
          <p class="note" id="sum-budget-note"></p>
        </article>
      </section>

      <!-- Filters -->
      <section class="panel toolbar" aria-label="Filters">
        <label class="search">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="f-q" type="search" placeholder="Search transactions..." aria-label="Search transactions">
        </label>
        <select id="f-type" class="select" aria-label="Type">
          <option value="">All Types</option>
          <option value="INCOME">Income</option>
          <option value="EXPENSE">Expense</option>
        </select>
        <select id="f-cat" class="select" aria-label="Category">
          <option value="">All Categories</option>
        </select>
        <input id="f-from" class="select" type="date" aria-label="From date">
        <input id="f-to" class="select" type="date" aria-label="To date">
        <button id="f-reset" class="btn ghost" type="button">Reset</button>
        <button id="add-btn" class="btn primary" type="button">+ Add transaction</button>
      </section>

      <!-- Table -->
      <section class="panel tx-panel" aria-label="Transactions">
        <div class="table-wrap">
          <table class="tx-table">
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Description</th>
                <th scope="col">Category</th>
                <th scope="col">Type</th>
                <th scope="col" class="r">Amount</th>
                <th scope="col" class="r">Actions</th>
              </tr>
            </thead>
            <tbody id="tx-body"></tbody>
          </table>
        </div>
        <div class="pager-row">
          <p class="muted" id="pager-info">Showing 0 transactions</p>
          <nav class="pager" id="pager" aria-label="Pages"></nav>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- Add / edit popup -->
<dialog id="tx-dialog" class="dialog" aria-labelledby="dlg-title">
  <form id="tx-form" novalidate>
    <h2 id="dlg-title">Add transaction</h2>

    <div class="seg" role="group" aria-label="Type">
      <button type="button" class="seg-btn" data-type="EXPENSE" aria-pressed="true">Expense</button>
      <button type="button" class="seg-btn" data-type="INCOME" aria-pressed="false">Income</button>
    </div>

    <label class="field"><span>Category</span>
      <select id="d-cat" required></select>
    </label>
    <label class="field"><span>Amount (₹)</span>
      <input id="d-amount" type="number" min="0.01" step="0.01" required>
    </label>
    <label class="field"><span>Date</span>
      <input id="d-date" type="date" required>
    </label>
    <label class="field"><span>Description</span>
      <input id="d-desc" type="text" maxlength="255">
    </label>

    <p class="form-error" id="d-error" role="alert" hidden></p>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" id="d-cancel">Cancel</button>
      <button type="submit" class="btn primary" id="d-save">Save</button>
    </div>
  </form>
</dialog>

<!-- Delete confirmation -->
<dialog id="del-dialog" class="dialog small" aria-labelledby="del-title">
  <h2 id="del-title">Delete this transaction?</h2>
  <p id="del-text">This cannot be undone.</p>
  <div class="dlg-actions">
    <button type="button" class="btn ghost" id="del-cancel">Cancel</button>
    <button type="button" class="btn danger" id="del-confirm">Delete</button>
  </div>
</dialog>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/transactions.js}" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<div class="shell">

  <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>

  <div class="content">

    <!-- Hero banner: greeting + alerts bell + user (the top bar lives inside it) -->
    <section class="hero">
      <p class="greet" id="greet">Hello,</p>
      <header th:replace="~{fragments/layout :: topbar('Welcome back!', 'Here is a quick look at your finances for this month.')}"></header>
    </section>

    <main class="page" id="main">

      <!-- Row 1: four summary cards -->
      <section class="cards" aria-label="Summary">
        <article class="stat s-green">
          <div class="stat-head">
            <span class="chip chip-green"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h2M3 10h18"/></svg></span>
            <span class="lbl">Remaining Balance</span>
          </div>
          <p class="val" id="val-balance">–</p>
          <p class="note" id="note-balance"></p>
        </article>

        <article class="stat s-lavender">
          <div class="stat-head">
            <span class="chip chip-violet"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg></span>
            <span class="lbl">Total Inflow</span>
          </div>
          <p class="val" id="val-income">–</p>
          <p class="note" id="note-income"></p>
        </article>

        <article class="stat s-peach">
          <div class="stat-head">
            <span class="chip chip-amber"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></span>
            <span class="lbl">Total Outflow</span>
          </div>
          <p class="val" id="val-expense">–</p>
          <p class="note" id="note-expense"></p>
        </article>

        <article class="stat s-blue">
          <div class="stat-head">
            <span class="chip chip-navy"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></span>
            <span class="lbl">Budget Left</span>
          </div>
          <p class="val" id="val-budget">–</p>
          <p class="note" id="note-budget"></p>
        </article>
      </section>

      <!-- Row 2: calendar | expenses by category | today -->
      <section class="row3">

        <section class="panel cal" aria-labelledby="cal-title">
          <div class="panel-head">
            <h2 id="cal-title">Calendar</h2>
            <div class="cal-nav">
              <button type="button" id="cal-prev" class="link-btn" aria-label="Previous month">&#8249;</button>
              <button type="button" id="cal-next" class="link-btn" aria-label="Next month">&#8250;</button>
            </div>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
          <ul class="cal-legend">
            <li><span class="dot dot-exp"></span>Expense</li>
            <li><span class="dot dot-inc"></span>Income</li>
            <li><span class="dot dot-both"></span>Both</li>
          </ul>
        </section>

        <section class="panel" aria-labelledby="cat-title">
          <div class="panel-head">
            <h2 id="cat-title">Expenses by Category</h2>
            <select class="select" id="period" aria-label="Period">
              <option value="0">This Month</option>
              <option value="1">Last Month</option>
            </select>
          </div>
          <div class="cat-body">
            <div class="donut-box">
              <canvas id="donut" aria-label="Spending by category" role="img"></canvas>
              <div class="donut-mid"><strong id="donut-total">–</strong><span>Total Spent</span></div>
            </div>
            <ul class="legend" id="legend"></ul>
          </div>
        </section>

        <section class="panel" aria-labelledby="today-title">
          <div class="panel-head">
            <h2 id="today-title">Today</h2>
            <a class="add-btn" th:href="@{/transactions}" href="#" aria-label="Add transaction">+</a>
          </div>
          <div class="today-sum">
            <span class="lbl">Total Expenses</span>
            <strong id="today-total">–</strong>
            <span class="note" id="today-count"></span>
          </div>
          <ul class="today-list" id="today-list"></ul>
          <a class="more" th:href="@{/transactions}" href="#">View all &rarr;</a>
        </section>

      </section>

      <!-- Row 3: budgets -->
      <section class="panel bud-panel" aria-labelledby="bud-title">
        <div class="panel-head">
          <h2 id="bud-title">Budgets</h2>
          <a class="more" th:href="@{/budgets}" href="#">View all &rarr;</a>
        </div>
        <ul class="bud-cards" id="bud-list"></ul>
      </section>

    </main>
  </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<script th:src="@{/js/dashboard.js}" defer></script>
</body>
</html>

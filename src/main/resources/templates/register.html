<!DOCTYPE html>
<!--
  templates/register.html
  Same "natural template" idea as login.html (works from Spring Boot and when opened from disk).
  The backend (P1) still needs a controller that maps GET /register to this template.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/auth.css" th:href="@{/css/auth.css}">
</head>
<body>
  <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>

  <main class="card">
    <div class="art">
      <canvas id="painting" role="img" aria-label="A painted landscape of hills under the sky, made of tiny dots"></canvas>
      <figure class="quote">
        <p>&ldquo;Beware of little expenses; a small leak will sink a great ship.&rdquo;</p>
        <span>Benjamin Franklin</span>
      </figure>
    </div>

    <section class="form-side">
      <div class="brand"><span class="coin" aria-hidden="true">₹</span>Expense Tracker</div>

      <p class="greet">Welcome.</p>
      <h1>Create your account.</h1>
      <p class="lead">Add your details and you can start tracking what you spend and what is left each month.</p>

      <div id="message" class="message" role="alert" hidden></div>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="100" placeholder="Your name" required aria-describedby="name-error">
          <p class="field-error" id="name-error" hidden></p>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="150" placeholder="you@example.com" required aria-describedby="email-error">
          <p class="field-error" id="email-error" hidden></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Choose a password" required aria-describedby="password-error">
            <button type="button" class="toggle" data-toggle-password="password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <p class="field-error" id="password-error" hidden></p>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-wrap">
            <!-- confirmPassword is only checked in the browser. It is never sent to the backend. -->
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Type it again" required aria-describedby="confirmPassword-error">
            <button type="button" class="toggle" data-toggle-password="confirmPassword" aria-label="Show confirm password" aria-pressed="false">Show</button>
          </div>
          <p class="field-error" id="confirmPassword-error" hidden></p>
        </div>
        <button type="submit" class="submit" id="submit">Create account</button>
      </form>

      <!-- Shown by register.js after the backend confirms the account was created -->
      <div class="success-box" id="success" role="status" hidden>
        <div class="message success" id="success-text"></div>
        <a class="submit" id="go-login" href="login.html" th:href="@{/login}">Go to log in</a>
      </div>

      <p class="switch">Already have an account? <a href="login.html" th:href="@{/login}">Log in</a></p>
    </section>
  </main>

  <!-- Order matters: api.js first, then the shared UI helpers, then this page's script. -->
  <script src="../static/js/api.js" th:src="@{/js/api.js}" defer></script>
  <script src="../static/js/auth-ui.js" th:src="@{/js/auth-ui.js}" defer></script>
  <script src="../static/js/register.js" th:src="@{/js/register.js}" defer></script>
</body>
</html>

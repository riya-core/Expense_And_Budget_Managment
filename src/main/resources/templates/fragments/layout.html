<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<!-- 1. HEAD: fonts + stylesheet. Use: <head th:replace="~{fragments/layout :: head('Dashboard')}"></head> -->
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' | Expense Tracker'">Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Caveat:wght@600&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<!-- 2. SIDEBAR. Use: <aside th:replace="~{fragments/layout :: sidebar('dashboard')}"></aside>
     Allowed names: dashboard, transactions, budgets, reports -->
<aside class="side" id="sidebar" th:fragment="sidebar(active)" aria-label="Main navigation">
  <div class="brand"><span class="coin" aria-hidden="true">₹</span>Expense Tracker</div>

  <ul class="nav">
    <li>
      <a class="nav-item" th:href="@{/dashboard}" th:attr="aria-current=${active == 'dashboard' ? 'page' : null}">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
        Dashboard
      </a>
    </li>
    <li>
      <a class="nav-item" th:href="@{/transactions}" th:attr="aria-current=${active == 'transactions' ? 'page' : null}">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
        Transactions
      </a>
    </li>
    <li>
      <a class="nav-item" th:href="@{/budgets}" th:attr="aria-current=${active == 'budgets' ? 'page' : null}">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4"/></svg>
        Budgets
      </a>
    </li>
    <li>
      <a class="nav-item" th:href="@{/reports}" th:attr="aria-current=${active == 'reports' ? 'page' : null}">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
        Reports
      </a>
    </li>
  </ul>

  <div class="side-foot">
    <button class="nav-item" id="logout-btn" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/></svg>
      Log out
    </button>
  </div>
</aside>

<!-- 3. TOP BAR: title, alerts bell, user. Use: <header th:replace="~{fragments/layout :: topbar('Dashboard', 'Your money at a glance')}"></header> -->
<header class="top" th:fragment="topbar(title, subtitle)">
  <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <div class="hello">
    <h1 th:text="${title}">Title</h1>
    <p th:text="${subtitle}">Subtitle</p>
  </div>

  <div class="controls">
    <div class="bell-wrap">
      <button class="bell" id="bell" type="button" aria-label="Alerts" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg>
        <span class="bell-badge" id="bell-badge" hidden>0</span>
      </button>
      <div class="bell-panel" id="bell-panel" hidden>
        <div class="bell-head">
          <strong>Alerts</strong>
          <button class="link-btn" id="bell-readall" type="button">Mark all read</button>
        </div>
        <ul class="bell-list" id="bell-list"></ul>
      </div>
    </div>

    <div class="avatar-wrap">
      <span class="avatar" id="avatar" aria-hidden="true">?</span>
      <span class="uname" id="uname"></span>
    </div>
  </div>
</header>

<!-- 4. SCRIPTS. Use at the end of each page body: <th:block th:replace="~{fragments/layout :: scripts}"></th:block> -->
<th:block th:fragment="scripts">
  <script th:src="@{/js/api.js}" defer></script>
  <script th:src="@{/js/layout.js}" defer></script>
</th:block>

</body>
</html>
